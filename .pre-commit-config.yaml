# =============================================================================
# MSP AI Platform - Pre-Commit Configuration
# =============================================================================
# Install:
#   pip install pre-commit
#   pre-commit install
#   pre-commit install --hook-type commit-msg
#
# Run on all files:
#   pre-commit run --all-files
#
# Update hooks to latest versions:
#   pre-commit autoupdate
# =============================================================================

default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]

repos:
  # ===========================================================================
  # GENERAL FILE FORMATTING
  # ===========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        args: [--markdown-linebreak-ext=md]

      - id: end-of-file-fixer
        name: Fix end of files
        exclude: '^\.terraform/'

      - id: check-yaml
        name: Check YAML syntax
        args: [--allow-multiple-documents]

      - id: check-json
        name: Check JSON syntax
        exclude: 'Pipfile\.lock'

      - id: check-toml
        name: Check TOML syntax

      - id: check-xml
        name: Check XML syntax

      - id: check-merge-conflict
        name: Check for merge conflicts

      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=500']

      - id: check-case-conflict
        name: Check for case conflicts

      - id: check-executables-have-shebangs
        name: Check shebangs

      - id: detect-private-key
        name: Detect private keys

      - id: detect-aws-credentials
        name: Detect AWS credentials
        args: ['--allow-missing-credentials']

      - id: no-commit-to-branch
        name: Prevent direct commits to main
        args: ['--branch', 'main', '--branch', 'master']

  # ===========================================================================
  # PYTHON - FORMATTING & LINTING
  # ===========================================================================
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        name: Format Python code (black)
        language_version: python3.13
        args: [--line-length=100]

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort Python imports (isort)
        args: [--profile=black, --line-length=100]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: Lint Python code (ruff)
        args: [--fix, --exit-non-zero-on-fix]

      - id: ruff-format
        name: Format Python code (ruff)

  # ===========================================================================
  # PYTHON - SECURITY
  # ===========================================================================
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        name: Security lint (bandit)
        args: [-c, pyproject.toml, -ll, -ii]
        additional_dependencies: ['bandit[toml]']

  # ===========================================================================
  # PYTHON - TYPE CHECKING
  # ===========================================================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: Type check Python (mypy)
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies:
          - types-requests
          - types-python-dateutil
          - boto3-stubs[dynamodb,s3,sqs,secretsmanager,cloudwatch,ses]
        exclude: '^tests/'

  # ===========================================================================
  # TERRAFORM - FORMATTING & VALIDATION
  # ===========================================================================
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
        name: Format Terraform code
        args:
          - --args=-recursive

      - id: terraform_validate
        name: Validate Terraform configuration
        args:
          - --hook-config=--retry-once-with-cleanup=true

      - id: terraform_docs
        name: Generate Terraform docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true

      - id: terraform_tflint
        name: Lint Terraform (tflint)
        args:
          - --args=--only=terraform_deprecated_interpolation
          - --args=--only=terraform_deprecated_index
          - --args=--only=terraform_unused_declarations
          - --args=--only=terraform_comment_syntax
          - --args=--only=terraform_documented_outputs
          - --args=--only=terraform_documented_variables
          - --args=--only=terraform_typed_variables
          - --args=--only=terraform_module_pinned_source
          - --args=--only=terraform_naming_convention
          - --args=--only=terraform_required_version
          - --args=--only=terraform_required_providers

      - id: terraform_tfsec
        name: Security scan (tfsec)
        args:
          - --args=--soft-fail

  # ===========================================================================
  # COMMIT MESSAGE VALIDATION
  # ===========================================================================
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.29.1
    hooks:
      - id: commitizen
        name: Validate commit message
        stages: [commit-msg]

  # ===========================================================================
  # DOCKER
  # ===========================================================================
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        name: Lint Dockerfiles

  # ===========================================================================
  # MARKDOWN
  # ===========================================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args: [--disable, MD013, MD033, MD041]

  # ===========================================================================
  # SECRETS DETECTION (COMPREHENSIVE)
  # ===========================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: Detect secrets (gitleaks)

# =============================================================================
# GLOBAL EXCLUSIONS
# =============================================================================
exclude: |
  (?x)^(
    \.terraform/|
    \.build/|
    layers/.*/layer\.zip|
    htmlcov/|
    \.venv/|
    site/|
    \.pytest_cache/|
    .*\.egg-info/|
    __pycache__/|
    .*\.pyc$|
    cdk\.out/|
    .*\.tfstate.*|
    .*\.backup|
    docs/architecture/ieee1471/rendered/
  )