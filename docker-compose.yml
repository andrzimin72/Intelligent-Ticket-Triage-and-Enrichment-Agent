# =============================================================================
# MSP Triage Infrastructure - Local Development with LocalStack
# =============================================================================
# Provides local AWS service mocking for testing without deploying to AWS.
#
# Usage:
#   make localstack-up      # Start LocalStack
#   make localstack-down    # Stop LocalStack
#   make test-local         # Run tests against LocalStack
#
# Services:
#   - LocalStack: Mock AWS services (DynamoDB, S3, SQS, etc.)
#   - LocalStack Web UI: Visual interface for LocalStack
# =============================================================================

version: '3.8'

services:
  # ===========================================================================
  # LocalStack - AWS Service Mock
  # ===========================================================================
  localstack:
    image: localstack/localstack:3.0
    container_name: localstack
    ports:
      - "4566:4566"            # LocalStack Gateway
      - "4510-4559:4510-4559"  # External services port range
    environment:
      # Enable specific AWS services
      - SERVICES=dynamodb,s3,sqs,secretsmanager,lambda,apigateway,cloudwatch,ses,bedrock
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
      # Persist data across restarts
      - PERSISTENCE=1
      # Auto-load resources on startup
      - START_WEB=1
    volumes:
      - "${TMPDIR:-/tmp}/localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./localstack-init:/etc/localstack/init/ready.d"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - msp-network

  # ===========================================================================
  # LocalStack Web UI (Optional)
  # ===========================================================================
  localstack-web:
    image: localstack/localstack-web:latest
    container_name: localstack-web
    ports:
      - "8080:8080"
    environment:
      - LOCALSTACK_HOST=localstack
      - LOCALSTACK_PORT=4566
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - msp-network

# =============================================================================
# Networks
# =============================================================================
networks:
  msp-network:
    driver: bridge