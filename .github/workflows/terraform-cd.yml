# =============================================================================
# MSP AI Platform - CD Pipeline
# =============================================================================
# Handles deployment to dev, staging, and production environments.
#
# Deployment Flow:
#   - dev:       Automatic on merge to main
#   - staging:   Manual trigger, 1 approver required
#   - prod:      Manual trigger, 2 approvers required, state backup
#
# Post-deployment:
#   - Smoke tests
#   - E2E tests (dev only)
#   - Security tests (dev only)
#   - Slack notifications
# =============================================================================

name: Terraform CD

on:
  push:
    branches: [main]
    paths:
      - '**.tf'
      - '**.py'
      - 'layers/**'
      - 'src_*/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      run_e2e_tests:
        description: 'Run E2E tests after deployment'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: '1.6.0'
  PYTHON_VERSION: '3.13'
  AWS_REGION: us-east-1

jobs:
  # ===========================================================================
  # Deploy to dev (automatic on merge to main)
  # ===========================================================================
  deploy-dev:
    name: Deploy to dev
    if: github.event_name == 'push' || github.event.inputs.environment == 'dev'
    runs-on: ubuntu-latest
    environment: 
      name: dev
      url: https://console.aws.amazon.com/
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Build Lambda layers
        run: |
          for dir in layers/*/; do
            if [ -f "$dir/build.sh" ]; then
              echo "Building layer: $dir"
              (cd "$dir" && bash build.sh)
            fi
          done

      - name: Terraform Apply (dev)
        run: |
          terraform apply -auto-approve -var-file="terraform.tfvars.dev"

      - name: Install test dependencies
        run: |
          pip install pytest requests

      - name: Install hey (load testing tool)
        run: |
          go install github.com/rakyll/hey@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Set API outputs
        id: outputs
        run: |
          echo "api_url=$(terraform output -raw tenant_onboarding_api_url)" >> $GITHUB_OUTPUT
          echo "api_key=$(terraform output -raw tenant_onboarding_api_key)" >> $GITHUB_OUTPUT

      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Run smoke tests
        env:
          API_URL: ${{ steps.outputs.outputs.api_url }}
          API_KEY: ${{ steps.outputs.outputs.api_key }}
        run: |
          echo "Running smoke tests..."
          curl -sf "$API_URL/status" -H "x-api-key: $API_KEY" | jq .
          echo "✓ Smoke tests passed"

      - name: Run E2E tests
        if: github.event.inputs.run_e2e_tests == 'true'
        env:
          API_URL: ${{ steps.outputs.outputs.api_url }}
          API_KEY: ${{ steps.outputs.outputs.api_key }}
          ENVIRONMENT: dev
        run: |
          chmod +x scripts/test/*.sh
          ./scripts/test/test_e2e_customer_journey.sh || echo "⚠ E2E journey tests had failures"
          ./scripts/test/test_e2e_security_incident.sh || echo "⚠ E2E security tests had failures"

      - name: Run load tests (quick)
        if: github.event.inputs.run_e2e_tests == 'true'
        env:
          API_URL: ${{ steps.outputs.outputs.api_url }}
          API_KEY: ${{ steps.outputs.outputs.api_key }}
        run: |
          ./scripts/test/test_load_api.sh --quick || echo "⚠ Load tests had failures"

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ Dev deployment successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *Dev Deployment Successful*\n\nCommit: `${{ github.sha }}`\nAuthor: ${{ github.actor }}\nWorkflow: ${{ github.workflow }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚨 Dev deployment FAILED",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚨 *Dev Deployment FAILED*\n\nCommit: `${{ github.sha }}`\nAuthor: ${{ github.actor }}\nWorkflow: ${{ github.workflow }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ===========================================================================
  # Deploy to staging (manual trigger with approval)
  # ===========================================================================
  deploy-staging:
    name: Deploy to staging
    if: github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: 
      name: staging  # Requires 1 approver in GitHub
      url: https://console.aws.amazon.com/
    needs: []
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Build Lambda layers
        run: |
          for dir in layers/*/; do
            if [ -f "$dir/build.sh" ]; then
              (cd "$dir" && bash build.sh)
            fi
          done

      - name: Terraform Plan (staging)
        run: terraform plan -var-file="terraform.tfvars.staging" -out=tfplan

      - name: Terraform Apply (staging)
        run: terraform apply -auto-approve tfplan

      - name: Set API outputs
        id: outputs
        run: |
          echo "api_url=$(terraform output -raw tenant_onboarding_api_url)" >> $GITHUB_OUTPUT

      - name: Run smoke tests
        env:
          API_URL: ${{ steps.outputs.outputs.api_url }}
          API_KEY: ${{ secrets.STAGING_API_KEY }}
        run: |
          curl -sf "$API_URL/status" -H "x-api-key: $API_KEY" | jq .

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '🚨' }} Staging deployment ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ job.status == 'success' && '✅ *Staging Deployment Successful*' || '🚨 *Staging Deployment FAILED*' }}\n\nCommit: `${{ github.sha }}`\nApprover: ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ===========================================================================
  # Deploy to prod (manual trigger with strict approval)
  # ===========================================================================
  deploy-prod:
    name: Deploy to prod
    if: github.event.inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: 
      name: production  # Requires 2 approvers in GitHub
      url: https://console.aws.amazon.com/
    needs: []
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Build Lambda layers
        run: |
          for dir in layers/*/; do
            if [ -f "$dir/build.sh" ]; then
              (cd "$dir" && bash build.sh)
            fi
          done

      - name: Pre-deploy backup
        run: |
          echo "Creating state backup before prod deployment..."
          terraform state pull > backup-$(date +%Y%m%d-%H%M%S).tfstate
          aws s3 cp backup-*.tfstate s3://${{ secrets.TF_STATE_BACKUP_BUCKET }}/backups/

      - name: Terraform Plan (prod)
        run: terraform plan -var-file="terraform.tfvars.prod" -out=tfplan

      - name: Terraform Apply (prod)
        run: terraform apply -auto-approve tfplan

      - name: Set API outputs
        id: outputs
        run: |
          echo "api_url=$(terraform output -raw tenant_onboarding_api_url)" >> $GITHUB_OUTPUT

      - name: Run smoke tests
        env:
          API_URL: ${{ steps.outputs.outputs.api_url }}
          API_KEY: ${{ secrets.PROD_API_KEY }}
        run: |
          curl -sf "$API_URL/status" -H "x-api-key: $API_KEY" | jq .

      - name: Notify Slack and PagerDuty
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '🚨' }} PROD deployment ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ job.status == 'success' && '✅ *PROD Deployment Successful*' || '🚨 *PROD Deployment FAILED - INITIATE ROLLBACK*' }}\n\nCommit: `${{ github.sha }}`\nApprover: ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK